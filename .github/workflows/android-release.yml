# Manual signed Android App Bundle. Upload to Play internal testing only when
# GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is set. The keystore never leaves the runner.
name: Android release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      CAPACITOR_SERVER_URL: ${{ secrets.CAPACITOR_SERVER_URL }}
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;35.0.0"
          sdkmanager --install "build-tools;36.0.0" || true

      - name: Install dependencies
        run: npm ci

      - name: Decode the upload keystore
        run: |
          python3 - << 'PY'
          import base64, os, pathlib
          raw = os.environ.get("ANDROID_KEYSTORE_BASE64", "").strip()
          password = os.environ.get("ANDROID_KEYSTORE_PASSWORD", "").strip()
          alias = os.environ.get("ANDROID_KEY_ALIAS", "").strip()
          key_password = os.environ.get("ANDROID_KEY_PASSWORD", "").strip()
          if not raw or not password or not alias or not key_password:
              raise SystemExit(
                  "ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, "
                  "ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD are required."
              )
          path = pathlib.Path("android/upload-keystore.p12")
          path.write_bytes(base64.b64decode(raw))
          path.chmod(0o600)
          with pathlib.Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf8") as handle:
              handle.write(f"ANDROID_KEYSTORE_PATH={path.resolve()}\n")
          print(f"Keystore written ({path.stat().st_size} bytes)")
          PY

      - name: Sync the Android shell
        run: npx cap sync android

      - name: Build the signed app bundle
        working-directory: android
        run: chmod +x ./gradlew && ./gradlew bundleRelease

      - name: Verify the bundle is signed
        run: jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload the app bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ask-jesus-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Check for a Play service account
        id: play
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 - << 'PY'
          import base64, os, pathlib
          raw = os.environ.get("GOOGLE_PLAY_SERVICE_ACCOUNT_JSON", "").strip()
          output = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          if not raw:
              print("GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is empty. Skipping the Play upload.")
              with output.open("a", encoding="utf8") as handle:
                  handle.write("enabled=false\n")
              raise SystemExit(0)
          text = raw if raw.startswith("{") else base64.b64decode(raw).decode()
          if not text.lstrip().startswith("{"):
              raise SystemExit("GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is not JSON or base64 JSON.")
          path = pathlib.Path("android/play-service-account.json")
          path.write_text(text, encoding="utf8")
          path.chmod(0o600)
          with output.open("a", encoding="utf8") as handle:
              handle.write("enabled=true\n")
          print("Play service account is present. The internal track upload will run.")
          PY

      - name: Upload to Play internal testing
        if: steps.play.outputs.enabled == 'true'
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJson: android/play-service-account.json
          packageName: com.starseedsquad.askjesus
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
